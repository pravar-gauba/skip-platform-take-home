version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
      - "9008:9008"
      - "8081:8081"
    environment:
      - POSTGRES_DSN=postgres://user:password@db:5432/app?sslmode=disable
    depends_on:
      - db

  db:
    image: postgres:14
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: app
    ports:
      - "5432:5432"
